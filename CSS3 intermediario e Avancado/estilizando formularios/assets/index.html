<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <title>Estilzando Formulários</title>
  </head>
  <body>
    <h1>Estilizando Formulários</h1>
    <form action="">
      <fieldset>
        <legend>Detalhes do Contato</legend>
        <div>
          <label for="nome">Nome:</label>
          <input type="text" name="nome" id="nome" />
        </div>
        <div>
          <label for="email">Email:</label>
          <input type="text" name="email" id="email" />
        </div>
        <div>
          <label for="url">URL:</label>
          <input type="text" name="url" id="url" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Comentários</legend>
        <div>
          <label for="mensagem">Mensagem:</label>
          <textarea name="mensagem" id="mensagem"></textarea>
        </div>
      </fieldset>

      <fieldset>
        <legend>Lembrar de mim</legend>
        <div>
          <label for="">
            <input class="radio" type="radio" name="lembrar" id="sim" />Sim
          </label>
        </div>
        <div>
          <label for="">
            <input class="radio" type="radio" name="lembrar" id="sim" />Não
          </label>
        </div>
      </fieldset>
    </form>
  </body>
</html>
