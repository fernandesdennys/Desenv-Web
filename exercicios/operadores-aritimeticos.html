<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <script>
    const altura = parseFloat(prompt("Digite sua altura (em metros):"));
    const peso = parseFloat(prompt("Digite seu peso:"));

    const imc = peso / (altura * altura);

    if (imc >= 40) {
        document.write("Obesidade classe 3");
    } else if (imc >= 35) {
        document.write("Obesidade classe 2");
    } else if (imc >= 30) {
        document.write("Obesidade classe 1");
    } else if (imc >= 25) {
        document.write("Excesso de peso");
    } else if (imc >= 18.5) {
        document.write("Peso normal");
    } else {
        document.write("Abaixo do peso");
    }
</script>
</body>
</html>
