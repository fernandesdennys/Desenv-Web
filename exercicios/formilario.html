<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="processa.html">
        <fieldset>

            <legend>Dadoos pessoais</legend>

            <label for="nome">Nome</label><br>
            <input type="text" name="" id="nome"><br>

            <label for="email">Email</label><br>
            <input type="email" name="" id="email"><br>
            
            <input type="checkbox" name="" id="receber_email" value="ativado">
            <label for="receber_email">Quero receber e-mail</label><br><br>

            <label for="senha">Senha</label><br>
            <input type="password" name="" id="senha"><br>
        </fieldset><br>

        <fieldset>
            <legend>Infrmações adicionais</legend>

            <input type="radio" name="" id="pf">
            <label for="pf">Pessoa Fúisica</label>
            
            <input type="radio" name="" id="pj">
            <label for="pj">Pessoa Jurídica</label>
        </fieldset><br>

        <input type="submit" value="cadastrar">

    </form>
</body>
</html>
