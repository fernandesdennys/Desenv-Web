<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      
      let idade = prompt("Digite sua idade:");

if (idade >= 0 && idade < 15) {
  document.write("Criança");
} else if (idade < 30) {
  document.write("Jovem");
} else if (idade < 60) {
  document.write("Adulto");
} else {
  document.write("Idoso");
}
    </script>
  </body>
</html>
