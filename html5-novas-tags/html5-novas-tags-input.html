<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/input-style.css" />
  
    <title>Novas Tags de input HTML5</title>
  </head>
  <body>
    <form action="">
      <!-- Novos inputs e atrubutos HTML 6 -->
       <!-- required = torna o input com prioridade de preenchimento -->
      <label for="nome">Nome:</label>
      <input type="text" name="nome" id="nome" required="required">
      <br><br>

      <!-- Email -->
      <label for="email">E-mail:</label>
      <input type="email" name="email" id="email">
      <br><br>

      <!-- Número -->
       <!-- step = pula a quantidade de numeros escolhido -->
       <label for="numero">Número:</label>
       <input type="number" name="number" id="number" min="1" max="20" step="5">
       <br><br>

       <!-- URL -->
        <label for="url">URL:</label>
        <input type="url" name="url" id="url" placeholder="ex: http//www...">
        <br><br>

        <!-- Pesquisa -->
         <label for="pesquisa">Pesquisa:</label>
         <input type="search" name="pesquisa" id="pesquisa">
         <br><br>

         <!-- Range -->
          <label for="range">Range:</label>
          <input type="range" name="range" id="range" min="1" max="100">
          <br><br>

          <!-- Data -->
           <label for="data">Data:</label>
           <input type="date" name="data" id="data">
           <br><br>

           <!-- Cor -->
            <label for="Cor">Cor:</label>
            <input type="color" name="cor" id="cor">
            <br><br>

      <input type="submit" value="Enviar">
    </form>
    
  </body>
</html>
