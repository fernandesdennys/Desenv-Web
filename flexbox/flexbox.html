<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox - Flexible Box Layout</title>
  <style>
    #conteudo {
      background:  #dcdcdc;
      /* width: 230px; */
      height: 600px;
      display: flex;

      /* flex-direction: row; */
      /* row/row-reverse/colum/colum-reverse */

      /* flex-wrap: nowrap; */
      /* wrap/no-wrap/wrap-reverse */
      
      /* justify-content: space-around; */
      /* flex-start/flex-end/center/space-between/space-around */

      /* align-items: center; */
      /* stretch/center/flex-start/flex-end/baseline */
    }
    /* .ordem1 {
      order: 4;
    }
    .ordem2 {
      order: 3;
    }
    .ordem3 {
      order: 2;
    }
    .ordem4 {
      order: 1;
    } */
    
    .item {
      display: flex;
      justify-content: center;
      align-items: center;
      /* width: 200px; */
      height: 100px;
      margin: 10px;
      background: white;
      border:  1px solid gray;

      /* Define proporção de espaço ocupado por um item. */
      flex-grow: 1;

      /* Define a capacidade de redução de tamanho do item. */
      flex-shrink:0; 

      /* Indica o tamanho inicial do flex item antes da distrubuição do espaço restante */
      flex-basis: 200px;
    }
    
    .item1 {
      flex-shrink: 1;
      /* flex-grow: 1; */
    }
    .item2 {
      /* flex-shrink: 2; */
      flex-grow: 2;
    }
    .item3 {
      /* flex-shrink: 3; */
      flex-grow: 3;
    }
    .item4 {
      /* flex-shrink:6; */
      flex-grow: 4;
    }

  </style>
</head>
<body>
  <h1>Flexbox</h1>
  <div id="conteudo">
    <div class="item item1 ordem1">01</div>
    <div class="item item2 ordem2">02</div>
    <div class="item item3 ordem3">03</div>
    <div class="item item4 ordem4">04</div>
  </div>
  
</body>
</html>
