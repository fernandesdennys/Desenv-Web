<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/meucss.css" />

    <title>Interface de Login</title>
  </head>

  <body>

    <main class="login-container">
      <section class="login-card">
        
        <!-- Cabeçalho -->
        <header class="login-header">
          <img src="img/trello.svg" alt="Logo do Trello" />

          <h1>Entre para continuar</h1>
        </header>

        <!-- Formulário -->
        <form class="login-form">
          <!-- Campo de email -->
          <div class="form-group">
            <label for="email"> E-mail <span>*</span> </label>

            <input
              type="email"
              name="email"
              id="email"
              placeholder="Insira seu e-mail"
              autocomplete="email"
              required
            />
          </div>

          <!-- Checkbox -->
          <label class="checkbox-group">
            <input type="checkbox" name="conectado" id="conectado" />

            Continuar conectado
          </label>

          <!-- Botão principal -->
          <button type="submit" class="btn-primary">Continuar</button>
        </form>

        <!-- Login alternativo -->
        <div class="social-login">
          <span class="divider"> Ou entrar com: </span>

          <button type="button" class="social-button">Passkey</button>

          <span class="divider"> Ou prossiga com: </span>

          <button type="button" class="social-button">
            <img src="img/google.svg" alt="Logo do Google" />
            Google
          </button>

          <button type="button" class="social-button">
            <img src="img/microsoft.svg" alt="Logo da Microsoft" />
            Microsoft
          </button>

          <button type="button" class="social-button">
            <img src="img/apple.svg" alt="Logo da Apple" />
            Apple
          </button>

          <button type="button" class="social-button">
            <img src="img/slack.svg" alt="Logo do Slack" />
            Slack
          </button>
        </div>

        <!-- Links -->
        <nav class="login-links">
          <a href="#"> Não consegue entrar? </a>

          <span>*</span>

          <a href="#"> Criar conta </a>
        </nav>
      </section>
    </main>

    <!-- Rodapé fixo -->
    <div class="footer-fixed">
      <img src="img/analytics.svg" alt="Logo Analytics" />

      <img src="img/interactive.svg" alt="Logo Interactive" />
    </div>

    <!-- Footer -->
    <footer class="main-footer">
      <img src="img/atlassian.svg" alt="Logo Atlassian" />

      <p>
        Uma conta para Trello, Jira, Confluence e
        <a href="#">mais!</a>
      </p>

      <div class="footer-links">
        <a href="#"> Política de privacidade </a>

        <span>*</span>

        <a href="#"> Aviso ao usuário </a>
      </div>
    </footer>
  </body>
</html>
