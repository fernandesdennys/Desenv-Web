<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="https://id-frontend.prod-east.frontend.public.atl-paas.net/assets/index.19f82625.css" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/meucss.css">
    <title>Interface de login do Trello</title>

    <!--
      <script src="https://unpkg.com/@codans/trello"></script>
    -->

</head>
<body>
  <section>
    <div id="trelo_head">
      <img src="img/trello.svg" alt="logo_trello">
      <p>Entre para continuar</p>
    </div>

    <div id="box_input">
      <label for="email">E-mail<span>*</span></label>
      <input type="email" name="email" id="email" placeholder="Insira seu e-mail">
      <p>
        <input type="checkbox" name="conectado" id="conectado">Continuar conectado
      </p>
    </div>

    <div id="box_button">
      <button type="submit" id="submit_button">Continuar</button>
      <span>Ou entrar com:</span>
      <button>Passkey</button>
      <span>Ou prossiga com:</span>
      <button type="submit"><img src="img/google.svg" alt="">Google</button>
      <button type="submit"><img src="img/microsoft.svg" alt="microsoft">Microsoft</button>
      <button type="submit"><img src="img/apple.svg" alt="apple">Apple</button>
      <button type="submit"><img src="img/slack.svg" alt="slack">Slack</button>      
    </div>
    <div>
      <a href="#">Não consegue entrar?</a>
      <span> * </span>
      <a href="#">Criar conta</a>
    </div>
    
    <hr>

  </section>
  
  <div id="footer_fixo">
    <img src="img/analytics.svg" alt="alalytics">
    <img src="img/interactive.svg" alt="interactive">
  </div>
  
  <footer>
     <img src="img/atlassian.svg" alt="altasian">
        <p>Uma conta para Trello, Jira, Confluence e <a href="#">mais!</a></p>
      </div>
      <div>
        <a href="#">Politica de privacidade</a>
        <span> * </span>  
        <a href="#">Aviso ao usuário</a>
      </div>
      
  </footer>

</body>
</html>
