<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap-5.3.7-dist/css/bootstrap.min.css" />
    <title>Bootstrap</title>
  </head>

  <body style="margin-bottom: 200px; padding: 16px">
    <!-- 
    mt -> Margin Top
    mb -> Margin Bottom
    me -> Margin End
    ms -> Margin Start
    mx -> Margin no eixo x (horizontal) esquerdo/direito
    my -> Margin no eixo y (vertical) top/bottom
    m  -> Margim em todos os lados
    Valor a definir (0 até 5)
    -->
    <h1 class="bg-success">Margin</h1>
    <p class="bg-success my-5 mx-5">Conteúdo principal</p>
    <h1 class="bg-success">Margin</h1>

    <br />
    <br />

    <!-- 
    pt -> Padding Top
    pb -> Padding Bottom
    pe -> Padding End
    ps -> Padding Start
    px -> Padding no eixo x (horizontal) esquerdo/direito
    py -> Padding no eixo y (vertical) top/bottom
    p  -> Padding em todos os lados valor a definir (0 até 5)
    -->
    <h1 class="bg-warning">Padding</h1>
    <p
      class="bg-warning px-5 py-5"
      style="display: flex; justify-content: center"
    >
      <strong
        >Lorem ipsum dolor sit amet consectetur adipisicing elit. Quasi modi,
        aliquid inventore illo deserunt reiciendis soluta nulla atque blanditiis
        alias, accusantium enim. Sint deleniti, nihil architecto nisi sed id
        eum!</strong
      >
    </p>
    <h1 class="bg-warning">Padding</h1>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
      integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
      crossorigin="anonymous"
    ></script>
    <script src="js/bootstrap.min.js"></script>
  </body>
</html>
